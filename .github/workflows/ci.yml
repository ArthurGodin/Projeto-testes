name: CI - Testes Automatizados

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    name: Testes de API - Petstore
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes de API
        run: pytest tests/api/ -v --tb=short

  web-tests:
    name: Testes Web - SauceDemo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Chrome e ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes Web
        run: |
          export DISPLAY=:99
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          pytest tests/web/ -v --tb=short
